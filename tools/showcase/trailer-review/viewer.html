<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frontline · Trailer editions</title>
<style>
:root{color-scheme:dark;font:16px/1.5 system-ui,sans-serif;background:#171915;color:#f2ebd6}
body{max-width:1600px;margin:auto;padding:clamp(1rem,3vw,3rem)}
h1{font-size:clamp(1.5rem,3vw,3rem);margin:0 0 1rem}
main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
section{min-width:0}
video{display:block;width:100%;aspect-ratio:16/9;background:black;margin:.75rem 0}
button,select{font:inherit;padding:.4rem .6rem;border-radius:.3rem}
label{display:inline-flex;align-items:center;gap:.5rem}
.controls{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin:1rem 0}
input[type=range]{flex:1;min-width:8rem;accent-color:#e7bb63}
output{font-variant-numeric:tabular-nums}
p{margin:0;color:#c5c4b8}
@media(max-width:680px){main{grid-template-columns:1fr}}
</style>
<h1>Frontline trailer editions</h1>
<main>
<section><label>Compare <select id="left"></select></label><video muted playsinline preload="auto"></video><p></p></section>
<section><label>With <select id="right"></select></label><video muted playsinline preload="auto"></video><p></p></section>
</main>
<div class="controls">
<button id="play" type="button">Play both</button>
<input id="scrub" aria-label="Shared playhead" type="range" min="0" max="765" step="1" value="0">
<output id="time">0.0 / 25.5 s</output>
<label>Hear <select id="listen"><option value="1">Right cut</option><option value="0">Left cut</option><option value="-1">Neither</option></select></label>
</div>
<p role="status" id="status"></p>
<script type="application/json" id="versions">__VERSIONS__</script>
<script>
const cuts = JSON.parse(document.querySelector('#versions').textContent);
const videos = [...document.querySelectorAll('video')];
const pickers = [document.querySelector('#left'), document.querySelector('#right')];
const play = document.querySelector('#play'), scrub = document.querySelector('#scrub');
const listen = document.querySelector('#listen'), status = document.querySelector('#status');
let position = 0, raf;
function display(at) {
  position = at;
  scrub.value = Math.round(at * 30);
  document.querySelector('#time').textContent = at.toFixed(1) + ' / 25.5 s';
}
function pause() {
  cancelAnimationFrame(raf);
  videos.forEach(v => v.pause());
  play.textContent = 'Play both';
}
function seek(at) {
  videos.forEach(v => { if (v.readyState >= 1) v.currentTime = at; });
  display(at);
}
function tick() {
  const [a,b] = videos;
  if (Math.abs(a.currentTime - b.currentTime) > .10) b.currentTime = a.currentTime;
  display(a.currentTime);
  if (a.ended || b.ended) { pause(); return; }
  raf = requestAnimationFrame(tick);
}
function switchCut(i) {
  pause();
  const cut = cuts[pickers[i].selectedIndex], video = videos[i];
  video.onloadedmetadata = () => { video.currentTime = position; };
  video.src = cut.file;
  video.parentElement.querySelector('p').textContent = cut.note;
}
pickers.forEach((picker,i) => {
  cuts.forEach((c,n) => picker.add(new Option(c.label,n)));
  picker.selectedIndex = i === 0 ? 0 : cuts.length - 1;
  picker.onchange = () => switchCut(i);
  switchCut(i);
});
function selectAudio() { videos.forEach((v,i) => v.muted = i !== Number(listen.value)); }
selectAudio();
listen.onchange = selectAudio;
play.onclick = async () => {
  if (videos.some(v => !v.paused)) { pause(); return; }
  if (position >= 25.45) seek(0);
  try { await Promise.all(videos.map(v => v.play())); }
  catch { pause(); status.textContent = 'Playback failed. Check that both MP4s are beside this viewer.'; return; }
  status.textContent = '';
  play.textContent = 'Pause both';
  tick();
};
scrub.oninput = () => { pause(); seek(Number(scrub.value) / 30); };
</script>
</html>

<!doctype html><html lang="en"><meta charset="utf-8"><title>Frontline showcase</title>
<style>
@font-face{font-family:Barlow;src:url('../../web/node_modules/@fontsource/barlow/files/barlow-latin-400-normal.woff2')}
@font-face{font-family:Condensed;src:url('../../web/node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-600-normal.woff2')}
*{box-sizing:border-box}body{margin:0;background:#090d0a;color:#f2ebd6;font-family:Barlow,Arial,sans-serif;width:1600px;height:900px;padding:36px 44px;display:grid;grid-template-rows:112px 1fr 68px;gap:18px}
header{border-top:3px solid #f5c96e;padding-top:12px;display:grid;grid-template-columns:1fr auto;gap:6px 24px}h1{font:600 38px/1.1 Condensed,Arial,sans-serif;margin:0}aside{color:#f5c96e;font:18px/1.4 monospace;letter-spacing:2px}p{margin:0;font-size:24px;line-height:1.3;grid-column:1/-1;max-width:1450px}.media{display:flex;gap:20px;min-height:0;align-items:center;justify-content:center;background:#090d0a;border:1px solid #34382e;padding:10px}.media figure{margin:0;flex:1;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}.media img{max-width:100%;max-height:100%;object-fit:contain;min-height:0}.media figcaption{font-size:20px;color:#e0cd98}footer{border-top:1px solid #34382e;padding-top:12px;color:#a5a899;font-size:19px;line-height:1.3;display:flex;justify-content:space-between;gap:30px}footer span{max-width:1280px}.brand{color:#f5c96e;font-family:Condensed;letter-spacing:3px;white-space:nowrap}
</style><header><h1></h1><aside></aside><p></p></header><div class="media"></div><footer><span></span><b class="brand">FRONTLINE / FIELD NOTES</b></footer>
<script>
window.present=async(data)=>{document.querySelector('h1').textContent=data.title;document.querySelector('aside').textContent=data.version+' / '+data.kind.toUpperCase();document.querySelector('header p').textContent=data.summary;document.querySelector('footer span').textContent=data.attribution;let host=document.querySelector('.media');host.replaceChildren();for(let i=0;i<data.sources.length;i++){let fig=document.createElement('figure'),img=document.createElement('img');img.src='../../'+data.sources[i].file;img.alt=data.sources[i].caption;fig.append(img);if(data.sources.length>1){let cap=document.createElement('figcaption');cap.textContent=i===0?'BEFORE':'AFTER';fig.append(cap)}host.append(fig)}await document.fonts.ready;await Promise.all([...document.images].map(img=>img.decode()));}
</script></html>

name: Check

# The game: every script compiles, and a few scenarios and a mission run
# headless without a script error. The website and the matchmaker have their
# own workflows (web.yml, matchmaker.yml).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Build numeric simulation extension
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          python3 tools/build_native.py

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot

      - name: Import and compile every script
        run: |
          ~/godot/godot --headless --path . --import 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error" import.log; then exit 1; fi

      - name: Simulation scaling regressions
        run: |
          set -o pipefail
          for test in structure_index perception_index navigation_budget client_loading update_sidecars terrain_updates squad_assessment map_placement snapshot_index terrain_cover soldier_batch structure_view; do
            timeout 120 ~/godot/godot --headless --path . res://tests/${test}_test.tscn 2>&1 | tee ${test}.log
            if grep -E "SCRIPT ERROR|Parse Error|failures=[1-9]" ${test}.log; then exit 1; fi
          done

      - name: Smoke test (headless scenarios)
        run: |
          port=7901
          for s in attack naval sling; do
            echo "::group::scenario $s"
            timeout 240 ~/godot/godot --headless --path . -- --scenario=$s --stats=60 --quit-after=40 --port=$port 2>&1 | tee run_$s.log || true
            port=$((port + 1))
            echo "::endgroup::"
            if grep -E "SCRIPT ERROR" run_$s.log; then echo "::error::script error in scenario $s"; exit 1; fi
            if ! grep -q "FINAL" run_$s.log; then echo "::error::scenario $s didn't finish"; exit 1; fi
          done

      - name: Smoke test (a mission, playing itself)
        run: |
          # the 1 km map takes a while to lay out on a CI runner; the mission's
          # first minute (the sling lift) is enough to catch a broken script
          timeout 420 ~/godot/godot --headless --path . -- --mission=skyhook --stats=60 --quit-after=60 --port=7920 2>&1 | tee run_mission.log || true
          if grep -E "SCRIPT ERROR" run_mission.log; then echo "::error::script error in the mission"; exit 1; fi
          if ! grep -q "FINAL" run_mission.log; then echo "::error::the mission didn't finish"; exit 1; fi

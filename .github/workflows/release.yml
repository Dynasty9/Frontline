name: Release

# Every merge to main that changes the game publishes a new numbered release
# (v0.1.4, v0.1.5, ...) with Windows and Linux builds, Frontline-windows.zip
# and Frontline-linux.zip. First it files the changelog entries the release
# was built with under changelog/vX.Y.Z/ (the release is named after its
# headline change) and bakes the changelog and the release (version, download
# links, checksums) into the website and the matchmaker, committing that to
# main, which redeploys both. The GitHub release's notes are the changelog.
#
#   - The bump is a patch unless the merged pull request has a "minor" or
#     "major" label. A "skip release" label skips it.
#   - Merges that only touch docs, the website, the matchmaker or CI don't
#     release (those deploy on their own: Railway builds web/ and matchmaker/).
#   - Run it by hand (Actions > Release > Run workflow) to release now, with
#     the bump of your choice.
#   - Pull requests that change the build itself export without releasing, and
#     keep the zips as workflow artifacts.
#
# The version is stamped into project.godot (application/config/version) before
# export, so a build knows what it is; from source it reads 0.0.0-dev.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - export_presets.cfg
      - .github/workflows/release.yml
      - .github/scripts/**
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

# releases from main go one at a time, in order, so each numbers itself after
# the last; a newer push to a pull request replaces its older run
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to release, and the version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          INPUT_BUMP: ${{ inputs.bump }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          release=false
          bump=patch
          if [ "$EVENT" = push ]; then
            # what the game is made of: a change anywhere else doesn't need a new build
            game='^(scripts/|assets/|project\.godot$|main\.tscn$|export_presets\.cfg$|icon\.svg$)'
            if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] \
               || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
               || git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE "$game"; then
              release=true
            fi
            # the labels on the pull request this push merged, if any
            labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[].labels[].name' 2>/dev/null || true)
            echo "labels: ${labels:-none}"
            if grep -qx 'skip release' <<< "$labels"; then release=false; fi
            if grep -qx 'major' <<< "$labels"; then bump=major; elif grep -qx 'minor' <<< "$labels"; then bump=minor; fi
          elif [ "$EVENT" = workflow_dispatch ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            release=true
            bump="${INPUT_BUMP:-patch}"
          fi
          version=$(.github/scripts/next-version.sh "$bump")
          if [ "$EVENT" = pull_request ]; then version="$version-pr.$PR_NUMBER"; fi
          build=true
          if [ "$EVENT" = push ] && [ "$release" = false ]; then build=false; fi
          echo "build=$build release=$release bump=$bump version=$version"
          {
            echo "build=$build"
            echo "release=$release"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.7.2
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-export-${{ env.GODOT_VERSION }}

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          # just the two templates we ship: the full set is over a gigabyte
          unzip -q -j templates.tpz templates/version.txt templates/windows_release_x86_64.exe templates/linux_release.x86_64 -d "$dest"
          rm godot.zip templates.tpz
          ls -la "$dest"

      - name: Stamp the version
        run: |
          sed -i "s/^config\/version=.*/config\/version=\"$VERSION\"/" project.godot
          grep -n '^config/version=' project.godot

      - name: Import and compile every script
        run: |
          ~/godot/godot --headless --path . --import 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error" import.log; then exit 1; fi

      - name: Export
        run: |
          mkdir -p build/windows build/linux
          ~/godot/godot --headless --path . --export-release "Windows" build/windows/Frontline.exe 2>&1 | tee export.log
          ~/godot/godot --headless --path . --export-release "Linux" build/linux/Frontline.x86_64 2>&1 | tee -a export.log
          test -s build/windows/Frontline.exe && test -s build/linux/Frontline.x86_64
          chmod +x build/linux/Frontline.x86_64
          for d in windows linux; do cp LICENSE build/$d/; (cd build/$d && zip -q -9 -r ../Frontline-$d.zip .); done
          ls -la build

      - name: Keep the zips as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Frontline-${{ env.VERSION }}
          path: build/Frontline-*.zip
          retention-days: 14

      # File the release's changelog (changelog/vX.Y.Z/) and bake it, with the
      # release's download links and checksums, into the website and the
      # matchmaker; committing that to main redeploys both on Railway. Before
      # publishing, so the release notes' screenshots are already on main.
      - name: File the changelog and bake the release into the website and the matchmaker
        if: needs.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # the pull request this release came from, for a release with no changelog entry
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0] // empty' 2>/dev/null || true)
          [ -n "$pr" ] || pr='{}'
          export PR_NUMBER=$(jq -r '.number // empty' <<< "$pr")
          export PR_TITLE=$(jq -r '.title // empty' <<< "$pr")
          export PR_BODY=$(jq -r '.body // empty' <<< "$pr")
          bash .github/scripts/bake-release.sh "$VERSION" "$GITHUB_SHA" build

      - name: Publish the release
        if: needs.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(python3 .github/scripts/changelog.py name "$VERSION")
          python3 .github/scripts/changelog.py notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" build/Frontline-windows.zip build/Frontline-linux.zip             --target "$GITHUB_SHA" --title "Frontline v$VERSION: $name" --notes-file "$RUNNER_TEMP/notes.md" --latest
          # numbered releases replace the old rolling "nightly" pre-release
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true

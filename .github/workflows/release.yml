name: Release

# Builds the game for Windows and Linux and publishes it on GitHub Releases,
# where the website's download buttons point:
#   - every push to main refreshes the "nightly" pre-release
#   - a tag like v0.2.0 publishes a release of that name
#   - pull requests that touch the build itself, and manual runs, build only
#     (the zips are kept as workflow artifacts)
# Each release carries Frontline-windows.zip and Frontline-linux.zip.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - export_presets.cfg
      - .github/workflows/release.yml
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-export-${{ env.GODOT_VERSION }}

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          # just the two templates we ship: the full set is over a gigabyte
          unzip -q -j templates.tpz templates/version.txt templates/windows_release_x86_64.exe templates/linux_release.x86_64 -d "$dest"
          rm godot.zip templates.tpz
          ls -la "$dest"

      - name: Import and compile every script
        run: |
          ~/godot/godot --headless --path . --import 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error" import.log; then exit 1; fi

      - name: Export
        run: |
          mkdir -p build/windows build/linux
          ~/godot/godot --headless --path . --export-release "Windows" build/windows/Frontline.exe 2>&1 | tee export.log
          ~/godot/godot --headless --path . --export-release "Linux" build/linux/Frontline.x86_64 2>&1 | tee -a export.log
          test -s build/windows/Frontline.exe && test -s build/linux/Frontline.x86_64
          chmod +x build/linux/Frontline.x86_64
          for d in windows linux; do cp LICENSE build/$d/; (cd build/$d && zip -q -9 -r ../Frontline-$d.zip .); done
          ls -la build

      - name: Keep the zips as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Frontline-builds
          path: build/Frontline-*.zip
          retention-days: 14

      - name: Publish the nightly pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly build/Frontline-windows.zip build/Frontline-linux.zip \
            --prerelease --target "$GITHUB_SHA" --title "Latest build of main" \
            --notes "Built automatically from $(git log -1 --format='%h: %s'). For a tested version, use the latest release."

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Frontline-windows.zip build/Frontline-linux.zip \
            --title "Frontline $GITHUB_REF_NAME" --generate-notes

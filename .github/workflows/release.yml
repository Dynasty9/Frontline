name: Release

# Releasing is a button: Actions > Release > Run workflow, on main, choosing
# how big a step it is (patch, minor or major) and, if you like, a name.
# Merging a pull request never releases anything: its changelog entry waits in
# changelog/unreleased/ until the next release, which ships everything that
# has merged since the last one.
#
# The run builds Windows and Linux from main as it stands (Frontline-windows.zip
# and Frontline-linux.zip), files every waiting entry under changelog/vX.Y.Z/,
# and bakes the changelog and the release (version, download links, checksums)
# into the website and the matchmaker, as one commit on a branch of its own,
# release/vX.Y.Z. It tags that commit, publishes the GitHub release with the
# changelog as its notes, and opens a pull request from the branch. Merging
# that pull request puts the release on the website and tells the matchmaker,
# and through it every copy of the game, that it's out. (main only takes pull
# requests, so the workflow can't commit there itself.)
#
#   - The version is the newest vX.Y.Z tag plus the step you chose.
#   - It won't release while the last release's pull request is still open
#     (its entries would ship twice), or when no entries are waiting.
#   - Opening the pull request needs Settings > Actions > General > "Allow
#     GitHub Actions to create and approve pull requests". Without it, the run
#     ends with a link to open it yourself.
#   - Pull requests that change the build itself export without releasing, and
#     keep the zips as workflow artifacts.
#   - First it applies any database migrations the live Supabase project
#     hasn't had (database.yml, which also runs as they merge): the release's
#     matchmaker and game may need them, and a failed migration stops it.
#
# The version is stamped into project.godot (application/config/version) before
# export, so a build knows what it is; from source it reads 0.0.0-dev.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: How big a step (patch for fixes, minor for new features, major for a milestone)
        type: choice
        options: [patch, minor, major]
        default: patch
      name:
        description: What to call the release (leave empty to name it after its headline change)
        type: string
        required: false
  pull_request:
    paths:
      - export_presets.cfg
      - .github/workflows/release.yml
      - .github/scripts/**

# releases go one at a time, so each numbers itself after the last; a newer
# push to a pull request replaces its older run
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide the version, and check there's something to release
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_BUMP: ${{ inputs.bump }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          release=false
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Release from main (this run is on $GITHUB_REF_NAME)."
              exit 1
            fi
            # the last release's entries reach main with its pull request
            last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
            if [ -n "$last" ] && [ ! -d "changelog/$last" ]; then
              echo "::error::$last's pull request (release/$last) isn't merged yet. Merge it first, or its changes would ship again."
              exit 1
            fi
            pending=$(python3 .github/scripts/changelog.py pending)
            if [ -z "$pending" ]; then
              echo "::error::Nothing to release: no changelog entries are waiting in changelog/unreleased/."
              exit 1
            fi
            release=true
          fi
          version=$(.github/scripts/next-version.sh "${INPUT_BUMP:-patch}")
          if [ "$EVENT" = pull_request ]; then version="$version-pr.$PR_NUMBER"; fi
          echo "release=$release version=$version"
          {
            echo "release=$release"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          if [ "$release" = true ]; then
            {
              echo "## Releasing v$version"
              echo
              echo '```'
              echo "$pending"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # the schema the release needs, before anything is built (usually there
  # already: database.yml applies migrations as they merge)
  database:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/database.yml
    secrets: inherit

  build:
    needs: [plan, database]
    # after the database, or without it for a pull request's trial export
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.database.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.7.2
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # the changelog looks up which pull request added each entry
          fetch-depth: 0

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-export-${{ env.GODOT_VERSION }}

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          # just the two templates we ship: the full set is over a gigabyte
          unzip -q -j templates.tpz templates/version.txt templates/windows_release_x86_64.exe templates/linux_release.x86_64 -d "$dest"
          rm godot.zip templates.tpz
          ls -la "$dest"

      - name: Stamp the version
        run: |
          sed -i "s/^config\/version=.*/config\/version=\"$VERSION\"/" project.godot
          grep -n '^config/version=' project.godot

      - name: Import and compile every script
        run: |
          ~/godot/godot --headless --path . --import 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error" import.log; then exit 1; fi

      - name: Export
        run: |
          mkdir -p build/windows build/linux
          ~/godot/godot --headless --path . --export-release "Windows" build/windows/Frontline.exe 2>&1 | tee export.log
          ~/godot/godot --headless --path . --export-release "Linux" build/linux/Frontline.x86_64 2>&1 | tee -a export.log
          test -s build/windows/Frontline.exe && test -s build/linux/Frontline.x86_64
          chmod +x build/linux/Frontline.x86_64
          for d in windows linux; do cp LICENSE build/$d/; (cd build/$d && zip -q -9 -r ../Frontline-$d.zip .); done
          ls -la build

      - name: Keep the zips as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Frontline-${{ env.VERSION }}
          path: build/Frontline-*.zip
          retention-days: 14

      # The release's own commit, on release/vX.Y.Z: its changelog filed, and the
      # release baked into the website and the matchmaker. Tagging it (rather
      # than main) keeps the release notes' screenshots where the tag says.
      - name: File the changelog and bake the release on its branch
        id: bake
        if: needs.plan.outputs.release == 'true'
        env:
          NAME: ${{ inputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "sha=$(bash .github/scripts/bake-release.sh "$VERSION" build "$NAME")" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        if: needs.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BAKED: ${{ steps.bake.outputs.sha }}
          # the screenshots, from the release's own tag: they reach main only with its pull request
          CHANGELOG_IMAGE_REF: v${{ env.VERSION }}
        run: |
          name=$(python3 .github/scripts/changelog.py name "$VERSION")
          python3 .github/scripts/changelog.py notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" build/Frontline-windows.zip build/Frontline-linux.zip \
            --target "$BAKED" --title "Frontline v$VERSION: $name" --notes-file "$RUNNER_TEMP/notes.md" --latest
          # numbered releases replace the old rolling "nightly" pre-release
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          echo "Published [v$VERSION: $name](https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION)." >> "$GITHUB_STEP_SUMMARY"

      - name: Open the pull request that brings the release into main
        if: needs.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(python3 .github/scripts/changelog.py name "$VERSION")
          branch="release/v$VERSION"
          {
            echo "v$VERSION is published: https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION"
            echo
            echo "Merging this files its changelog under \`changelog/v$VERSION/\` and puts the release on the website"
            echo "(download links, the changelog page) and the matchmaker, which is what tells every copy of the game"
            echo "that there's an update. Railway redeploys both when it merges."
            echo
            echo "Merge it before the next release: that one won't start while this is open."
          } > "$RUNNER_TEMP/pr.md"
          if url=$(gh pr create --base main --head "$branch" --title "Release v$VERSION: $name" --body-file "$RUNNER_TEMP/pr.md" 2>&1); then
            echo "$url"
            echo "Merge [the release's pull request]($url) to put it on the website and the matchmaker." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$url"
            compare="https://github.com/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
            echo "::warning title=Open the release's pull request::GitHub Actions may not open pull requests here (Settings > Actions > General > Allow GitHub Actions to create and approve pull requests). Open it yourself and merge it: $compare"
            echo "**Open [the release's pull request]($compare) and merge it** to put the release on the website and the matchmaker." >> "$GITHUB_STEP_SUMMARY"
          fi

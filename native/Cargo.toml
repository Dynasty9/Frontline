[package]
name = "frontline_sim"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
frontline_core = { path = "core" }
godot = { version = "=0.5.5", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1

[workspace]
members = ["core"]

[package]
name = "frontline_sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
frontline_core.workspace = true
godot = { version = "=0.5.5", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1

[workspace]
members = ["core", "runtime", "server", "browser"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"

[workspace.dependencies]
frontline_core = { path = "core" }
frontline_runtime = { path = "runtime" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
blake3 = "=1.8.7"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }

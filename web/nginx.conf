server {
    listen ${PORT};
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    location /game/ {
        gzip_static on;
        gzip_vary on;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    # Vite's bundles are named by their contents, so one never changes: keep
    # them for good. A missing one is a 404, never the page: a tab opened before
    # a deploy asks for the old build's bundles, and handed HTML for a script
    # the browser can only report a MIME error (the router reloads on a 404).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # The page names this build's bundles: always check for a newer one.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen ${PORT};
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    # An address the site has no page for gets the site's own "no such page",
    # with a 404, so search engines don't keep it (the build writes 404.html).
    error_page 404 /404.html;
    location /game/ {
        gzip_static on;
        gzip_vary on;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    # Vite's bundles are named by their contents, so one never changes: keep
    # them for good. A missing one is a 404, never the page: a tab opened before
    # a deploy asks for the old build's bundles, and handed HTML for a script
    # the browser can only report a MIME error (the router reloads on a 404).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Pictures, footage and the changelog's thumbnails: kept a day.
    location ~ ^/(media|shots|insignia|changelog-thumbs)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }
    # A player's page and a battle's are made as they're visited, from the
    # matchmaker: any callsign or battle gets the site, which fetches it.
    location /player/ {
        try_files $uri /index.html;
    }
    location /watch/ {
        try_files $uri /index.html;
    }
    # Every other page is a file the build wrote (scripts/prerender.mjs), with
    # its own title and link card. A page names its build's bundles: always
    # check for a newer one.
    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
    }
}

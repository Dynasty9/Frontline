server {
    listen ${PORT};
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    location /game/ {
        gzip_static on;
        gzip_vary on;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
